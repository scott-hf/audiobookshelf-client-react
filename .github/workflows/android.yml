name: Android

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # AGP 8.7.2 / capacitor-android require JDK 21 -- the default `actions/setup-java`
      # distribution below installs exactly that, unlike this repo's dev-machine default
      # JAVA_HOME (Temurin 17), which fails Gradle with "invalid source release: 21".
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mobile unit tests
        run: pnpm --filter @abs/mobile test

      - name: Mobile typecheck
        run: pnpm --filter @abs/mobile typecheck

      - name: Build mobile web bundle
        run: pnpm --filter @abs/mobile build

      - name: Sync Capacitor Android project
        run: pnpm --filter @abs/mobile cap:sync

      - name: Gradle unit tests + assembleDebug
        run: ./gradlew -p mobile/android testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shelfdroid-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
