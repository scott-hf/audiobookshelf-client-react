apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// WI-1496 t900 Task 6 (unsigned CI slice): the release signingConfig reads four env vars by
// name (never a committed value -- see mobile/android/keystore.properties.example and
// mobile/RELEASE.md). `file(System.getenv("ANDROID_KEYSTORE_PATH"))` throws at Gradle
// config-eval time on a null path, so the whole signingConfigs.release block (and wiring it
// into buildTypes.release) is guarded behind this flag -- it stays false in every environment
// without the four secrets (this dev machine, `assembleDebug`/`testDebugUnitTest` in CI), and
// only becomes true where CI injects the real t950 keystore secrets for a release build.
def hasReleaseSigningEnv = System.getenv("ANDROID_KEYSTORE_PATH") != null

android {
    namespace "com.hellofriend.shelfdroid"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hellofriend.shelfdroid"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigningEnv) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // Debug builds install alongside the release app and allow local (possibly
            // http, LAN-only) ABS servers during development.
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningEnv) {
                signingConfig signingConfigs.release
            }
            // Unsigned in every environment without the t950 keystore secrets (this dev
            // machine included) -- `bundleRelease`/`assembleRelease` still produce an artifact,
            // just an unsigned one, matching t900's acceptance text verbatim.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Encrypted SharedPreferences backing SecureSessionPlugin -- the only place ABS auth
    // tokens are persisted (never in the WebView's localStorage/IndexedDB).
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // Native audio playback (WI-1496 t700): foreground ExoPlayer service + MediaSessionCompat.
    implementation "com.google.android.exoplayer:exoplayer-core:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exoplayer_version"
    implementation "androidx.media:media:$androidxMediaVersion"
    // Chromecast handoff (WI-1496 t900 Task 3). extension-cast provides the OFFICIAL, tested
    // exoplayer2 CastPlayer/Timeline -- CastManager.kt/CastPlayer.kt deliberately build on this
    // artifact rather than hand-porting the donor app's local fork of it (see CastManager.kt's
    // class doc).
    implementation "com.google.android.exoplayer:extension-cast:$exoplayer_version"
    implementation "com.google.android.gms:play-services-cast-framework:21.3.0"
    implementation "androidx.mediarouter:mediarouter:1.6.0"
    // SAF folder picking for offline downloads (WI-1496 t800 Task 2) -- ActivityResult contract
    // AbsFileSystem's chooseDownloadFolder() uses via Plugin.startActivityForResult.
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation "com.github.bumptech.glide:glide:$glide_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version"
    // Authenticated range-request downloader (WI-1496 t800 Task 3, InternalDownloadManager).
    // NOT already available transitively -- t700's ExoPlayer playback path uses ExoPlayer's own
    // DefaultHttpDataSource (java.net.HttpURLConnection-backed), not an OkHttp extension, so this
    // is a new explicit dependency, not a reuse of an existing one.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.mockito:mockito-core:5.14.2"
    // Real org.json (not the Android SDK's "throw/return-default stub" jar) so
    // JSObject/JSONObject actually work in plain JVM unit tests.
    testImplementation "org.json:json:20240303"
    // DownloadItemManagerTest (WI-1496 t800 Task 3): fake HTTP server for range/401/byte-mismatch
    // scenarios, plus coroutine test utilities for awaiting the manager's launched transfer jobs.
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlin_coroutines_version"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // ServiceTestRule for PlaybackRecoveryTest (WI-1496 t700 Task 4).
    androidTestImplementation "androidx.test:rules:$androidxTestRulesVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
