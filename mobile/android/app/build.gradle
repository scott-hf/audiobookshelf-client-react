apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.hellofriend.shelfdroid"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hellofriend.shelfdroid"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Debug builds install alongside the release app and allow local (possibly
            // http, LAN-only) ABS servers during development.
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Encrypted SharedPreferences backing SecureSessionPlugin -- the only place ABS auth
    // tokens are persisted (never in the WebView's localStorage/IndexedDB).
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // Native audio playback (WI-1496 t700): foreground ExoPlayer service + MediaSessionCompat.
    implementation "com.google.android.exoplayer:exoplayer-core:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exoplayer_version"
    implementation "androidx.media:media:$androidxMediaVersion"
    // SAF folder picking for offline downloads (WI-1496 t800 Task 2) -- ActivityResult contract
    // AbsFileSystem's chooseDownloadFolder() uses via Plugin.startActivityForResult.
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation "com.github.bumptech.glide:glide:$glide_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.mockito:mockito-core:5.14.2"
    // Real org.json (not the Android SDK's "throw/return-default stub" jar) so
    // JSObject/JSONObject actually work in plain JVM unit tests.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // ServiceTestRule for PlaybackRecoveryTest (WI-1496 t700 Task 4).
    androidTestImplementation "androidx.test:rules:$androidxTestRulesVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
